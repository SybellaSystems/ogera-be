name: Backend CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build and type-check
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand